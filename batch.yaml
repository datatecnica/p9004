  # -------------------------------------------------------------------------
  # Aim 3 — Longitudinal trajectories by group (protein on LHS, interaction on RHS)
  #
  # Only time-varying predictors are valid LMM outcomes here. APOE_e4 and
  # p9005_Genetic_PRS_PRS157 are static per-patient and belong in the baseline runs
  # above, not in trajectories — hence `predictors: proteomic` (not `both`).
  # The 12 other non-proteomic biomarkers are also time-varying (measured at
  # multiple visits) and can be added via `predictors: both` if desired, but
  # default to proteomic-only here for interpretability.
  # -------------------------------------------------------------------------
  - name: trajectory_NSD_vs_HC
    model: lmm
    formula: "PROTEIN ~ YEAR * grp_NSD_vs_HC"
    report_term: "YEAR:grp_NSD_vs_HC"
    predictors: proteomic
    random_group: PATNO
    sample_filter: "grp_NSD_vs_HC.notna()"
    # Time-varying age_at_visit is collinear with YEAR within subject
    # (r = 0.9995, d(age)/d(YEAR) = 1.005); `age` is age at study baseline.
    drop_covariates: [age_at_visit]
    add_covariates: [age]
    # Split YEAR into within-subject change and between-subject sampling time,
    # reported as two terms. Keeps single-visit subjects (they inform the
    # intercept, group effect and covariates) without letting them contribute
    # to the trajectory coefficient, where they carry no information.
    decompose_time: true
    random_slope: YEAR

  - name: trajectory_CI_MOCA
