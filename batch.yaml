# Batch regression config — phase 1 wrap (harmonized dataset).
#
# Derived from ../adding_p312_and_P314/batch.yaml. Changes from that config:
#   * input is the rebuilt Project 9004 dataset (19,450 rows x 35,566 cols)
#   * ancestry strata and genetic PCs come from Project 9005, formerly numbered 9001
#     (GP2 release 12); the block prefix is p9005_ as of 2026-08-15
#   * PRS is p9005_Genetic_PRS_PRS157 (r=0.992 with the retired GP2_PRS_zscore)
#   * collection_era added as a covariate — see the note on default_covariates
#   * proteome-wide Bonferroni over 9,500 independent proteins (n_independent_proteins)
#
# The 6 harmonized_* prefixes are picked up automatically from ASSAY_PREFIXES in
# ../regressions.py, alongside the 12 project-specific prefixes. Because a harmonized
# column CONTAINS its reference project's values, the two are heavily correlated and the
# run-wide Bonferroni denominator would overstate the number of independent tests — read
# `significant_proteome` (fixed 9,500-protein denominator) as the headline lens and
# `significant_family` for per-block context.

defaults:
  # Read the Projects 312/314 dataset from the parent directory; all outputs
  # (results/, meta/, plots/) resolve relative to THIS config's directory.
  # Dated releases; regressions.py takes sorted(glob)[-1], and the YYYYMMDD stamp makes
  # that the newest build. Pin the exact filename here to fit an older release instead.
  input_glob: "Project_9004_Unified_Emerging_Biomarkers_*.tab"
  output_dir: "results"
  strata_col: p9005_Genetic_PRS_InfPop
  strata: [EUR, AJ]
  # Genetic PCs now come from Project 9005 (3,676 participants vs GP2's 2,620).
  #
  # collection_era is global rather than targeted. The intent was to adjust only where
  # Project 277 contributes, but every run loops ALL proteomic prefixes, so p277_CSF and
  # harmonized_olink_csf analytes appear in every run — there is no run-level scope that
  # isolates them. p277's post-2020 samples carry 2 healthy controls against 372 NSD+,
  # inflating its whole panel (lambda 2.49 vs p314_CSF's 1.11) and making its spike-in
  # control significant at P=3.9e-4. Era MUST be categorical: a linear year term is worse
  # than useless (lambda 1.731 vs 1.459) because it extrapolates through single-arm years.
  # Cost elsewhere is one df. Drop it per-run via drop_covariates for a sensitivity check.
  default_covariates: [age_at_visit, EDUCYRS, SEX, collection_era,
                       p9005_Genetic_PRS_PC1, p9005_Genetic_PRS_PC2, p9005_Genetic_PRS_PC3,
                       p9005_Genetic_PRS_PC4, p9005_Genetic_PRS_PC5]
  # Run only the six harmonized blocks as proteomic predictors (2026-08-18). Each
  # harmonized column pools the two projects that ran the same platform x panel x
  # biofluid, so it covers MORE participants than either source project alone —
  # e.g. harmonized_nulisa_inf_csf carries 772 in sPD_vs_LRRK2 against p282's 606.
  # Cuts 34,902 analytes to 11,567 (3.0x less compute, and no double-counting between
  # a harmonized column and the project it contains).
  #
  # Caveat: harmonized is a superset in PARTICIPANTS but a subset in ANALYTES, since
  # each block's core is the intersection of its two projects. 201 analytes have no
  # harmonized counterpart and are no longer tested — 94 from p312_Neuro_Plasma and
  # 84 from p312_Neuro_CSF (the Neuro panel is wider than the CNS panel it pairs
  # with, so AQP4, ATXN2/3, AXL, BCAN and the BD-pTau-T205/T212 species drop out),
  # 15 from p293_olink_plasma, and Abeta-38/40/42 from p288_CNS_plasma.
  # Set to `all` to test every project block instead.
  proteomic_scope: harmonized
  # Cox counterpart to min_groups_per_param: a survival model is carried by its
  # EVENTS, not its row count, so require events >= 2 x design parameters. Added
  # 2026-08-20, when fixing the Cox categorical bug made these fits run for the first
  # time and exposed cox_nsd_2b_to_later|AJ converging happily on 18 events against 17
  # parameters. Drops the four cox_nsd_2a/2b_to_later|AJ stratum-runs (0.5-1.2 events
  # per parameter) and keeps 86% of proteomic Cox rows.
  #
  # This removes what cannot be estimated, not everything underpowered: the remaining
  # AJ Cox runs sit at 2-4 events per parameter, well under the classic EPV rule of 10.
  # Every Cox row carries `events_per_param`, so a stricter cut is a filter downstream
  # rather than a refit. Raising it here prunes hard: 3 -> 68% of rows, 5 -> 46%,
  # 10 -> 12% (which would leave AJ represented by cox_pm_any alone). 0 disables.
  min_events_per_param: 2
  # Effective independent proteins for the proteome-wide Bonferroni lens.
  n_independent_proteins: 9500
  random_group: PATNO
  predictors: both        # proteomic | new | both | [list]
  min_n: 20               # minimum ROWS in a fit
  time_col: YEAR          # study-time axis: LMM decomposition + Cox entry time
  # An LMM must have at least this many independent clusters per fixed-effect
  # parameter. Eliminates saturated fits (8% of the 2026-07-30 trajectory hits had
  # fewer subjects than parameters) and cuts Wald-z vs t p-inflation 20.5x -> 1.9x.
  min_groups_per_param: 2
  # Cox: enter each participant into the risk set at the visit their predictor was
  # measured, not at study baseline. Without this, Project 312 (sampled at year 4)
  # contributes immortal person-time and 57-89% of its events precede measurement.
  delayed_entry: true

runs:

  # -------------------------------------------------------------------------
  # Aim 1 — Baseline comparisons (Logit)
  # -------------------------------------------------------------------------
  - name: NSD_vs_HC
    model: logit
    formula: "grp_NSD_vs_HC ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_NSD_vs_HC.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor

  - name: NSD_vs_notNSD_sPD
    model: logit
    formula: "grp_NSD_vs_notNSD_sPD ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_NSD_vs_notNSD_sPD.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    # NO disease_duration_years here (removed 2026-08-18). The outcome is whether the
    # participant is NSD+, and disease duration only exists for someone who has a
    # disease — it was present for 91% of NSD+ but 31% of NSD- in EUR (81% vs 19% in
    # AJ). Complete-case deletion therefore removed the control arm preferentially,
    # inverting the case:control ratio and halving N. See the note on
    # NSD_vs_notNSD_LRRK2 below. The PD-restricted runs further down keep it: there
    # both arms have a disease, so it is defined by construction.

  - name: NSD_vs_notNSD_LRRK2
    model: logit
    formula: "grp_NSD_vs_notNSD_LRRK2 ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_NSD_vs_notNSD_LRRK2.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    # NO disease_duration_years here (removed 2026-08-18). It is a post-outcome
    # variable in an NSD+/NSD- contrast: present for 91% of NSD+ but only 31% of NSD-
    # in EUR (81% vs 19% in AJ), because duration is undefined for an unaffected
    # carrier. Adjusting for it dropped EUR from 107 analyzable participants to 52 and
    # AJ from 232 to 91, and flipped the case:control ratio from 0.43 to 1.26 (EUR)
    # and 0.50 to 2.14 (AJ) — i.e. it selected the sample on a proxy for the outcome.
    # Downstream, N~38 against 16 parameters put every Olink fit into quasi-complete
    # separation, and the 2026-08-15 run wrote 519 rows out of 34,916 analytes.

  - name: NSD_vs_notNSD_GBA
    model: logit
    formula: "grp_NSD_vs_notNSD_GBA ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_NSD_vs_notNSD_GBA.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    # NO disease_duration_years here (removed 2026-08-18) — same post-outcome problem
    # as the two runs above. See the note on NSD_vs_notNSD_LRRK2.

  - name: NSD_vs_notNSD_prodromal
    model: logit
    formula: "grp_NSD_vs_notNSD_prodromal ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_NSD_vs_notNSD_prodromal.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor

  # Between-subgroup PD baseline contrasts. Each pair: basic + SAA-adjusted
  # variant (NSD_Status as covariate). All restrict to baseline; PD-only by
  # the flag definition (excludes double carriers).
  - name: sPD_vs_LRRK2
    model: logit
    formula: "grp_sPD_vs_LRRK2 ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_sPD_vs_LRRK2.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: sPD_vs_LRRK2_SAAadj
    model: logit
    formula: "grp_sPD_vs_LRRK2 ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_sPD_vs_LRRK2.notna() and NSD_Status.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years, NSD_Status]

  - name: sPD_vs_GBA
    model: logit
    formula: "grp_sPD_vs_GBA ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_sPD_vs_GBA.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: sPD_vs_GBA_SAAadj
    model: logit
    formula: "grp_sPD_vs_GBA ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_sPD_vs_GBA.notna() and NSD_Status.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years, NSD_Status]

  # NSD stage pairwise contrasts. Each contrast has two variants:
  #   <name>           — all-cohort (mixes prodromal NSD+ with PD NSD+)
  #   <name>_PDonly    — restricted to PD (COHORT==1) with disease_duration_years
  #                      adjustment for severity-as-time-since-diagnosis
  - name: NSD_stage_2A_vs_2B
    model: logit
    formula: "grp_NSD_stage_2A_vs_2B ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_NSD_stage_2A_vs_2B.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor

  - name: NSD_stage_2A_vs_2B_PDonly
    model: logit
    formula: "grp_NSD_stage_2A_vs_2B ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_NSD_stage_2A_vs_2B.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: NSD_stage_2A_vs_3
    model: logit
    formula: "grp_NSD_stage_2A_vs_3 ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_NSD_stage_2A_vs_3.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor

  - name: NSD_stage_2A_vs_3_PDonly
    model: logit
    formula: "grp_NSD_stage_2A_vs_3 ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_NSD_stage_2A_vs_3.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: NSD_stage_2B_vs_3
    model: logit
    formula: "grp_NSD_stage_2B_vs_3 ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_NSD_stage_2B_vs_3.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor

  - name: NSD_stage_2B_vs_3_PDonly
    model: logit
    formula: "grp_NSD_stage_2B_vs_3 ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_NSD_stage_2B_vs_3.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: NSD_stage_early_vs_late
    model: logit
    formula: "grp_NSD_stage_early_vs_late ~ PROTEIN"
    report_term: "PROTEIN"
    sample_filter: "grp_NSD_stage_early_vs_late.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor

  - name: CI_PI_baseline
    model: logit
    formula: "CI_PI ~ PROTEIN"
    report_term: "PROTEIN"
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "CI_PI.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: CI_MOCA_baseline
    model: logit
    formula: "CI_MOCA ~ PROTEIN"
    report_term: "PROTEIN"
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "CI_MOCA.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  # -------------------------------------------------------------------------
  # Aim 2 — Progression (OLS on slopes, Cox on time-to-event)
  # -------------------------------------------------------------------------
  - name: slope_moca
    model: ols
    formula: "slope_moca ~ PROTEIN"
    report_term: "PROTEIN"
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "slope_moca.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: slope_updrs3_off
    model: ols
    formula: "slope_updrs3_off ~ PROTEIN"
    report_term: "PROTEIN"
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "slope_updrs3_off.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  # LEDD-adjusted variant: same sample as above but with baseline LEDD as a
  # covariate. Useful for distinguishing protein effects on motor-progression
  # rate from confounding by baseline treatment exposure.
  - name: slope_updrs3_off_LEDD_adj
    model: ols
    formula: "slope_updrs3_off ~ PROTEIN"
    report_term: "PROTEIN"
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "slope_updrs3_off.notna() and LEDD.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years, LEDD]

  - name: slope_lowput_ratio
    model: ols
    formula: "slope_lowput_ratio ~ PROTEIN"
    report_term: "PROTEIN"
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "slope_lowput_ratio.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: cox_moca_lt26
    model: cox
    duration_col: tte_moca_lt26_years
    event_col: event_moca_lt26
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "tte_moca_lt26_years.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: cox_cogstate_worsen
    model: cox
    duration_col: tte_cogstate_worsen_years
    event_col: event_cogstate_worsen
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "tte_cogstate_worsen_years.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: cox_pm_any
    model: cox
    duration_col: tte_pm_any_years
    event_col: event_pm_any
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "tte_pm_any_years.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: cox_pm_cog_any
    model: cox
    duration_col: tte_pm_cog_any_years
    event_col: event_pm_cog_any
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "tte_pm_cog_any_years.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: cox_pm_mc_any
    model: cox
    duration_col: tte_pm_mc_any_years
    event_col: event_pm_mc_any
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "tte_pm_mc_any_years.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: cox_stage_d
    model: cox
    duration_col: tte_stage_d_years
    event_col: event_stage_d
    sample_filter: "tte_stage_d_years.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor

  - name: cox_nsd_2a_to_later
    model: cox
    duration_col: tte_nsd_2a_to_later_years
    event_col: event_nsd_2a_to_later
    sample_filter: "tte_nsd_2a_to_later_years.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor

  - name: cox_nsd_2b_to_later
    model: cox
    duration_col: tte_nsd_2b_to_later_years
    event_col: event_nsd_2b_to_later
    sample_filter: "tte_nsd_2b_to_later_years.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor

  # -------------------------------------------------------------------------
  # PRS interaction effects on progression
  # -------------------------------------------------------------------------
  - name: slope_moca_x_PRS
    model: ols
    formula: "slope_moca ~ PROTEIN * p9005_Genetic_PRS_PRS157"
    report_term: "PROTEIN:p9005_Genetic_PRS_PRS157"
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "slope_moca.notna() and p9005_Genetic_PRS_PRS157.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: slope_updrs3_off_x_PRS
    model: ols
    formula: "slope_updrs3_off ~ PROTEIN * p9005_Genetic_PRS_PRS157"
    report_term: "PROTEIN:p9005_Genetic_PRS_PRS157"
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "slope_updrs3_off.notna() and p9005_Genetic_PRS_PRS157.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

