    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  # Cox PRS-interaction runs use the `interaction_with` key (not formula
  # syntax — lifelines doesn't take formulas). The script builds an inline
  # `predictor:p9001_Genetic_PRS_PRS157` design column, includes both main effects,
  # and reports the interaction coef as the primary β/SE/P. The PRS main
  # effect must be in add_covariates.
  - name: cox_moca_lt26_x_PRS
    model: cox
    duration_col: tte_moca_lt26_years
    event_col: event_moca_lt26
    interaction_with: p9001_Genetic_PRS_PRS157
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "tte_moca_lt26_years.notna() and p9001_Genetic_PRS_PRS157.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
