    add_covariates: [disease_duration_years, LEDD]

  # OLS slope on lowput-ratio with PRS interaction.
  - name: slope_lowput_ratio_x_PRS
    model: ols
    formula: "slope_lowput_ratio ~ PROTEIN * p9001_Genetic_PRS_PRS157"
    report_term: "PROTEIN:p9001_Genetic_PRS_PRS157"
    # PD-only: this is a disease progression readout, and disease_duration_years
