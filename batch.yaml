    duration_col: tte_nsd_2b_to_later_years
    event_col: event_nsd_2b_to_later
    sample_filter: "tte_nsd_2b_to_later_years.notna()"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor

  # -------------------------------------------------------------------------
  # PRS interaction effects on progression
  # -------------------------------------------------------------------------
  - name: slope_moca_x_PRS
    model: ols
    formula: "slope_moca ~ PROTEIN * p9001_Genetic_PRS_PRS157"
    report_term: "PROTEIN:p9001_Genetic_PRS_PRS157"
    # PD-only: this is a disease progression readout, and disease_duration_years
    # is undefined for HC/prodromal so it can only be adjusted for within cases.
    sample_filter: "slope_moca.notna() and p9001_Genetic_PRS_PRS157.notna() and COHORT == 1"
    # One row per participant at their earliest visit carrying the predictor,
    # rather than EVENT_ID == BL. Project 312 was sampled at V08-V16, so a
    # BL restriction left it 6-16 participants instead of 169-266.
    visit_mode: earliest_with_predictor
    add_covariates: [disease_duration_years]

  - name: slope_updrs3_off_x_PRS
    model: ols
    formula: "slope_updrs3_off ~ PROTEIN * p9001_Genetic_PRS_PRS157"
    report_term: "PROTEIN:p9001_Genetic_PRS_PRS157"
    # PD-only: this is a disease progression readout, and disease_duration_years
